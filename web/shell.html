<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0d0a17">
  <title>Alchemist's Sort</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0a17; }
    canvas { display: block; touch-action: none; outline: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    #status {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #f9d173; font: 600 18px/1.4 Georgia, serif; text-align: center; padding: 16px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">Brewing…</div>
  <script>
    const status = document.getElementById('status');
    var Module = {
      canvas: document.getElementById('canvas'),
      setStatus: (text) => { status.textContent = text || ''; },
      monitorRunDependencies: () => {},
      onRuntimeInitialized: () => { status.textContent = ''; },
      onAbort: (what) => {
        status.textContent = 'The game stopped: ' + what;
        status.style.pointerEvents = 'auto';
      },
    };
    if (!document.createElement('canvas').getContext('webgl2')) {
      status.textContent = 'This browser has no WebGL 2, which the game needs.';
    }
  </script>
  {{{ SCRIPT }}}
</body>
</html>
