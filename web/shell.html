<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0d0a17">
  <title>Alchemist's Sort</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0a17; }
    canvas { display: block; touch-action: none; outline: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

    /* The loading screen: a flask that fills as the game downloads. */
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 16px; text-align: center; color: #f9d173; font: 600 18px/1.4 Georgia, serif;
      background: radial-gradient(ellipse at 50% 55%, #2a1c3a 0%, #120d1f 55%, #0d0a17 100%);
      transition: opacity 0.6s ease;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading h1 {
      margin: 0; font: 700 30px/1.15 Georgia, serif; letter-spacing: 0.08em; font-variant: small-caps;
      color: #f9d173; text-shadow: 0 2px 12px rgba(249, 209, 115, 0.25);
    }
    #flask { width: 132px; height: 170px; overflow: visible; }
    #flask .glass { fill: rgba(255, 255, 255, 0.05); stroke: rgba(255, 240, 220, 0.75); stroke-width: 3; }
    #flask .glow { fill: #ff7a4a; opacity: 0.18; filter: blur(14px); animation: glow 2.4s ease-in-out infinite; }
    #level { transition: transform 0.35s ease-out; }
    #wave { animation: wave 2.2s linear infinite; }
    .bubble { fill: rgba(255, 230, 220, 0.7); animation: rise 2.6s ease-in infinite; opacity: 0; }
    .bubble:nth-child(2) { animation-delay: 0.9s; animation-duration: 3.1s; }
    .bubble:nth-child(3) { animation-delay: 1.7s; animation-duration: 2.3s; }
    @keyframes wave { from { transform: translateX(0); } to { transform: translateX(-60px); } }
    @keyframes rise { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-60px); } }
    @keyframes glow { 50% { opacity: 0.3; } }
    #status { min-height: 1.4em; }
    #detail { font: 14px/1.4 Georgia, serif; color: rgba(249, 209, 115, 0.6); min-height: 1.4em; }
    #loading.failed #flask { opacity: 0.35; }
    #loading.failed { pointer-events: auto; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="loading">
    <h1>Alchemist's Sort</h1>
    <svg id="flask" viewBox="0 0 120 160" aria-hidden="true">
      <defs>
        <clipPath id="inside"><path d="M48 8 h24 v46 a42 42 0 1 1 -24 0 z"/></clipPath>
        <linearGradient id="potion" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ff6a7a"/><stop offset="1" stop-color="#b8204a"/>
        </linearGradient>
      </defs>
      <ellipse class="glow" cx="60" cy="118" rx="46" ry="30"/>
      <g clip-path="url(#inside)">
        <g id="level" style="transform: translateY(132px)">
          <path id="wave" fill="url(#potion)"
                d="M0 6 q15 -6 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 V200 H0 z"/>
          <g transform="translate(0 20)">
            <circle class="bubble" cx="52" cy="40" r="3"/>
            <circle class="bubble" cx="70" cy="46" r="2.2"/>
            <circle class="bubble" cx="60" cy="52" r="2.6"/>
          </g>
        </g>
      </g>
      <path class="glass" d="M48 8 h24 v46 a42 42 0 1 1 -24 0 z"/>
      <path d="M44 6 h32" stroke="rgba(255,240,220,0.75)" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <div id="status">Gathering ingredients…</div>
    <div id="detail"></div>
  </div>
  <script>
    const loading = document.getElementById('loading');
    const status = document.getElementById('status');
    const detail = document.getElementById('detail');
    const level = document.getElementById('level');

    // The flask fills over the whole start, a stage at a time, each given a
    // share of it by about how long it takes: the download, then compiling
    // the game, unpacking its data and the save, the game setting up, and
    // compiling its shaders, which on some machines takes longest of all.
    const STAGES = {
      download: { from: 0.00, to: 0.50, text: 'Gathering ingredients…' },
      wasm:     { from: 0.50, to: 0.58, text: 'Grinding herbs…' },
      unpack:   { from: 0.58, to: 0.64, text: 'Unpacking the satchel…' },
      setup:    { from: 0.64, to: 0.68, text: 'Laying out the tools…' },
      shaders:  { from: 0.68, to: 0.98, text: 'Lighting the candles…' },
      ready:    { from: 1.00, to: 1.00, text: 'Ready' },
    };
    const ORDER = Object.keys(STAGES);
    let stage = 'download', since = performance.now();
    let count = { done: 0, total: 0 }, countSince = since;
    let shown = 0, failed = false;
    const t0 = performance.now();

    // The build writes in the files' sizes, since a server that compresses
    // them reports the compressed length, not what the browser reads.
    const expected = { wasm: Number('@WASM_BYTES@') || 0, data: Number('@DATA_BYTES@') || 0 };
    const got = { wasm: 0, data: 0 };
    const total = { wasm: expected.wasm, data: expected.data };
    let wasmReady = false;

    function mb(n) { return (n / 1048576).toFixed(1); }

    // Moves on to stage `s` (never back), logging when, for the curious.
    function enter(s) {
      if (failed || ORDER.indexOf(s) <= ORDER.indexOf(stage)) return;
      stage = s;
      since = countSince = performance.now();
      count = { done: 0, total: 0 };
      console.info('[startup] ' + s + ' at ' + ((since - t0) / 1000).toFixed(2) + ' s');
      draw();
    }

    // The flask and the words, as far as the stage has got. Inside a stage
    // whose end can't be measured, the level creeps toward the next mark
    // and slows as it nears it, so it neither stalls nor runs ahead.
    function draw() {
      if (failed) return;
      const st = STAGES[stage], now = performance.now();
      const creep = (from, tau) => 0.9 * (1 - Math.exp(-(now - from) / tau));
      let t, text = st.text, numbers = '';
      if (stage === 'download') {
        const sum = got.wasm + got.data;
        const all = Math.max(total.wasm + total.data, sum, 1);
        t = Math.min(sum / all, 1);
        if (sum > 0) numbers = mb(sum) + ' / ' + mb(all) + ' MB';
      } else if (stage === 'shaders' && count.total > 0) {
        t = (count.done + creep(countSince, 1500)) / count.total;
        numbers = count.done + ' / ' + count.total;
      } else {
        t = stage === 'ready' ? 1 : creep(since, 800);
      }
      shown = Math.max(shown, st.from + (st.to - st.from) * Math.min(t, 1));
      // The liquid's surface runs from just above the flask's bottom (132)
      // to its neck (40).
      level.style.transform = 'translateY(' + (132 - 92 * shown) + 'px)';
      status.textContent = text;
      detail.textContent = numbers;
    }
    (function tick() { draw(); if (stage !== 'ready' && !failed) requestAnimationFrame(tick); })();

    function fail(text) {
      failed = true;
      loading.classList.remove('done');
      loading.classList.add('failed');
      status.textContent = text;
      detail.textContent = '';
    }

    // Count the bytes of the game's .wasm and .data as they arrive. A file
    // fetched twice (a server sending the .wasm as anything but
    // application/wasm makes the browser fetch it again to compile it
    // another way) counts once.
    const realFetch = window.fetch.bind(window);
    window.fetch = async (input, init) => {
      const url = typeof input === 'string' ? input : input.url;
      const kind = /\.wasm(\?|$)/.test(url) ? 'wasm' : /\.data(\?|$)/.test(url) ? 'data' : null;
      const response = await realFetch(input, init);
      if (!kind || !response.ok || !response.body) return response;
      if (!expected[kind]) total[kind] = Number(response.headers.get('content-length')) || 0;
      const reader = response.body.getReader();
      let read = 0;
      const counted = new ReadableStream({
        async pull(controller) {
          const { done, value } = await reader.read();
          if (done) { controller.close(); downloaded(); return; }
          read += value.byteLength;
          got[kind] = Math.max(got[kind], read);
          controller.enqueue(value);
        },
        cancel(reason) { reader.cancel(reason); },
      });
      return new Response(counted, { status: response.status, statusText: response.statusText, headers: response.headers });
    };
    function downloaded() {
      if (got.wasm >= total.wasm && got.data >= total.data) enter(wasmReady ? 'unpack' : 'wasm');
    }

    // The game compiled: the browser compiles the .wasm as it downloads, and
    // finishes after.
    for (const name of ['instantiateStreaming', 'instantiate']) {
      const real = WebAssembly[name];
      WebAssembly[name] = (...args) => real.apply(WebAssembly, args).then((result) => {
        wasmReady = true;
        if (stage === 'wasm') enter('unpack');
        return result;
      });
    }

    var Module = {
      canvas: document.getElementById('canvas'),
      // The build's own tag on the files' addresses, so a browser never
      // mixes a new page with an old game it kept.
      locateFile: (path) => path + '?v=@BUILD@',
      // Emscripten reports the data's download as "Downloading data... (n/m)",
      // in case it was fetched some way the counter above did not see.
      setStatus: (text) => {
        const m = /\((\d+)\/(\d+)\)/.exec(text || '');
        if (m && got.data === 0) {
          total.data = expected.data || Number(m[2]);
          got.data = Number(m[1]);
        }
      },
      monitorRunDependencies: () => {},
      // The data unpacked and the save loaded: the game starts and sets up,
      // then compiles its shaders, reporting how many are done, and shows
      // its first frame; then the flask fades.
      onRuntimeInitialized: () => {
        got.wasm = Math.max(got.wasm, total.wasm);
        got.data = Math.max(got.data, total.data);
        enter('unpack');
        enter('setup');
      },
      onStartup: (what, done, all) => {
        if (what === 'shaders') {
          enter('shaders');
          if (done !== count.done || all !== count.total) {
            count = { done, total: all };
            countSince = performance.now();
            console.info('[startup] shaders ' + done + ' / ' + all + ' at ' + ((countSince - t0) / 1000).toFixed(2) + ' s');
          }
        } else if (what === 'ready') {
          enter('ready');
          if (!failed) loading.classList.add('done');
        }
      },
      onAbort: (what) => fail('The game stopped: ' + what),
    };
    if (!document.createElement('canvas').getContext('webgl2')) {
      fail('This browser has no WebGL 2, which the game needs.');
    }
  </script>
  {{{ SCRIPT }}}
</body>
</html>
